name: Sonde HelloFresh

# Le script d'alerte du cadrage (§ 9) : chaque jeudi, avant les livraisons du vendredi, la
# même sonde que l'app lit le menu de la semaine et une recette sur les pages publiques. Si
# l'accès est rompu, une issue s'ouvre sur ce dépôt (donc un e-mail) : passer en mode dégradé
# (photo des fiches papier). Deux pages publiques par semaine, rien d'autre.
#
# GitHub ne lance les tâches planifiées que depuis la branche par défaut : la sonde tourne
# chaque jeudi une fois ce fichier fusionné dans main. Avant, « Run workflow » la lance à la main.

on:
  schedule:
    - cron: "17 6 * * 4"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sonde:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Compilée à part : un échec ici (compilation, dépendance) fait échouer le job sans issue,
      # au lieu de passer pour un accès rompu.
      - name: Compiler la sonde
        run: ./gradlew --quiet :sonde:installDist

      # Le script de démarrage, pas `gradlew run` : Gradle remplacerait le code 2 (« on ne
      # conclut rien ») par 1. La sortie ne contient que des numéros et des codes HTTP, jamais
      # un titre ni une adresse de recette (dépôt public).
      - name: Lancer la sonde
        id: sonde
        run: |
          set +e
          sonde/build/install/sonde/bin/sonde > sonde.txt 2>&1
          echo "code=$?" >> "$GITHUB_OUTPUT"
          cat sonde.txt

      - name: Ouvrir (ou compléter) l'issue d'alerte
        if: steps.sonde.outputs.code == '1'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          titre="Sonde HelloFresh : accès rompu"
          numero=$(gh issue list --state open --search "$titre in:title" --json number --jq '.[0].number')
          if [ -n "$numero" ]; then
            gh issue comment "$numero" --body-file sonde.txt
          else
            gh issue create --title "$titre" --body-file sonde.txt
          fi

      - name: Échouer si l'accès est rompu
        if: steps.sonde.outputs.code == '1'
        run: exit 1

      # Réseau absent ou refus passager du site (429, 503…) : pas d'issue, un simple avertissement.
      - name: Signaler une sonde sans conclusion
        if: steps.sonde.outputs.code == '2'
        run: |
          echo "::warning title=Sonde HelloFresh::Le site n'a pas répondu (réseau, limite de débit ou maintenance) : rien à conclure cette semaine."

      - name: Échouer si la sonde s'est arrêtée autrement
        if: steps.sonde.outputs.code != '0' && steps.sonde.outputs.code != '1' && steps.sonde.outputs.code != '2'
        run: exit 1
