name: Tests

# Les tests unitaires (core en JVM simple, app sous Robolectric, sans émulateur) à chaque push
# sur main et à chaque pull request. Sur les branches de travail, `apercu.yml` les lance déjà
# avant de compiler l'APK d'essai.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Lancer les tests unitaires
        run: ./gradlew :core:test :app:testDebugUnitTest --stacktrace

      - name: Publier les rapports de test
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-de-test
          path: |
            core/build/reports/tests
            app/build/reports/tests
          retention-days: 7

      # Les écrans rendus en PNG par les tests `capture/` (Robolectric, sans émulateur).
      - name: Publier les captures d'écran
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: app/build/captures
          if-no-files-found: ignore
          retention-days: 7
